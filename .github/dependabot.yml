# Dependabot version updates.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Not covered here, because Dependabot has no ecosystem for it:
#   - platformio.ini (platform and library pins)
#   - code/components/*/idf_component.yml (ESP-IDF managed components)
#   - the Home Assistant integration (empty `requirements` list)
# Those stay manual.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    pull-request-branch-name:
      separator: "-"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      python-tooling:
        patterns:
          - "*"
    pull-request-branch-name:
      separator: "-"
